[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-quant-deriv"
version = "3.31.0"
description = "Open-Source Zero-Lookahead Quantitative Research, Statistical Microstructure Validation & ONNX Runtime Inference Engine for Synthetic Jump-Diffusion & Continuous Volatility Processes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Christ Yvan", email = "yaochristyvan8@gmail.com" }
]
keywords = [
  "open-source",
  "quantitative-finance",
  "market-microstructure",
  "zero-lookahead",
  "onnx-runtime",
  "jump-diffusion",
  "survival-analysis",
  "backtesting",
  "claude-code",
  "algorithmic-trading"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Office/Business :: Financial :: Investment"
]
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scipy>=1.10.0",
  "scikit-learn>=1.3.0",
  "onnx>=1.14.0",
  "onnxruntime>=1.16.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0"
]

[project.urls]
Homepage = "https://github.com/Christ-yavn/bot-quant-"
Repository = "https://github.com/Christ-yavn/bot-quant-.git"
Documentation = "https://github.com/Christ-yavn/bot-quant-/tree/main/docs"
"Companion DSL Compiler" = "https://github.com/Christ-yavn/ITC-SMC-EXTRACTOR-"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
