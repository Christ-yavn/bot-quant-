name: CI — Quantitative Mechanics & Zero-Lookahead Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  pytest-suite:
    name: Python 3.12 Quantitative Invariant Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas scipy

      - name: Run Quantitative Mechanics & Anti-Lookahead Unit Tests
        run: pytest tests/test_quantitative_mechanics.py -v
